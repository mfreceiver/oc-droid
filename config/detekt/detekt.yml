# §sm-hardening B10: ocdroid detekt config.
# CRITICAL: `buildUponDefaultConfig: false` in app/build.gradle.kts means ONLY
# rules explicitly listed here are active. This is deliberate — running the full
# detekt default rule set produces 1975 pre-existing violations (complexity /
# return-count / exception-handling) that are OUT OF SCOPE for the hardening
# batch ("不改核心逻辑"). This gate enforces ONLY the custom `ocdroid` ruleset
# (sole-writer encapsulation). Default rules may be layered in incrementally in
# a future cleanup epic.
ocdroid:
  SessionStatusDirectWriteRule:
    active: true
  AuthorityDirectWriteRule:        # §U-MN6 Batch 3
    active: true
  UiMustNotImportDataApiRule:      # §wave0-ocdroid-2026-08-03
    active: true
  DataMustNotImportUiRule:         # §wave0-ocdroid-2026-08-03
    active: true
  NoRawDpLiteralRule:              # §wave0-ocdroid-2026-08-03
    active: true
  NoRawAlertDialogRule:            # §wave0-ocdroid-2026-08-03
    active: true
