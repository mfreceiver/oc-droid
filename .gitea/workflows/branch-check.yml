# branch-check: agent/** / feature/** / fix/** / ci/** 分支 push 时触发。
# 干净 CI 容器中跑 lint + 单测 + assembleDebug,验证任务分支可构建。
# 通过 ≠ 可发布,仅表示该分支远端验证 OK。详见 docs/specs/gitea-cicd.md。
#
# 设计:无外部 action(不依赖 github.com)。checkout 用内联 git clone 直连 Gitea;
# Gradle 依赖缓存改由 act_runner 的 ~/.gradle 持久卷复用(后续可加 Gitea 镜像 action)。
name: branch-check

on:
  push:
    branches:
      - agent/**
      - feature/**
      - fix/**
      - ci/**
  workflow_dispatch:

# 全局串行:runner 共用 gradle cache bind mount(/root/.gradle),并发 job 会锁冲突。
# group=ci-runner-serialization 让所有 workflow 在同 ref 上的 job 排队串行。
concurrency:
  group: ci-runner-serialization
  cancel-in-progress: false

jobs:
  build:
    runs-on: android   # → act_runner label android:docker://universal-ci-android:35-jdk21
    # Gradle dist 已预装在 image /root/.gradle/wrapper/dists/(image 内只读,
    # 每容器从 layer 拿,无锁冲突)。Maven deps 每 job 重下(~2.5min)。
    steps:
      - name: Checkout(优先 LAN,空时回退公网;见 docs/specs/gitea-lan-bypass.md)
        env:
          TOKEN: ${{ github.token }}
          GITEA_LAN_URL: ${{ vars.MY_GITEA_LAN_URL }}
        run: |
          set -e
          GITEA_URL="${GITEA_LAN_URL:-https://git.vectory.cn:18443}"
          SCHEME="${GITEA_URL%%://*}"
          HOST="${GITEA_URL#*://}"
          printf '%s://x-access-token:%s@%s\n' "$SCHEME" "$TOKEN" "$HOST" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git config --global credential.helper store
          git config --global advice.detachedHead false
          git clone "$GITEA_URL/mfreceiver/oc-droid.git" .
          git fetch --tags --force
          git checkout -q "${{ github.sha }}"
          echo "HEAD: $(git rev-parse --short HEAD) / $(git describe --tags --always 2>/dev/null)"

      - name: local.properties(指向 CI SDK)
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: remote-check(lint + test + assembleDebug)
        run: ./scripts/ci/remote-check.sh

      - name: 归档产物清单(job 容器内,供排查)
        if: always()
        run: |
          echo "=== APK ==="; ls -lh app/build/outputs/apk/debug/ 2>/dev/null || true
          echo "=== artifacts/ ==="; ls -lh artifacts/ 2>/dev/null || true
