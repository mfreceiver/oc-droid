# integration-check: main / integration/** / validation/** 变更跑全量校验。
# clean + 全量 lint + 全量测试 + assembleDebug + kover 覆盖率门控(与本地 check.sh --full 一致)。
# 模拟器插桩测试(需 kvm runner)留作后续阶段。无外部 action(不依赖 github.com)。
name: integration-check

on:
  push:
    branches: [ main, integration/**, validation/** ]
  workflow_dispatch:

# 全局串行:runner 共用 gradle cache bind mount(/root/.gradle),并发 job 会锁冲突。
# group=ci-runner-serialization 让所有 workflow 在同 ref 上的 job 排队串行。
concurrency:
  group: ci-runner-serialization
  cancel-in-progress: false

jobs:
  full-check:
    runs-on: android
    # GRADLE_USER_HOME 改容器内临时目录,避开 runner container.options 的
    # /root/.gradle bind mount(并发 job 共享会触发 journal-1.lock 冲突)。
    # 代价:每 job 重新下载 Gradle deps(~3min),换稳定性。
    env:
      GRADLE_USER_HOME: /tmp/gradle-home
    steps:
      - name: Checkout(LAN 直连 Gitea,绕过公网 TLS)
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          printf 'http://x-access-token:%s@192.168.3.252:11330\n' "$TOKEN" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git config --global credential.helper store
          git config --global advice.detachedHead false
          git clone http://192.168.3.252:11330/mfreceiver/oc-droid.git .
          git fetch --tags --force
          git checkout -q "${{ github.sha }}"
      - name: local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: clean + lint + test + assembleDebug
        run: ./gradlew --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug
      - name: kover 覆盖率门控
        run: ./gradlew --no-daemon koverVerify
