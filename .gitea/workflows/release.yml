# release: 受保护 v* tag push 触发,独立 release runner 出签名包。
# 签名密钥经 Gitea Secrets 注入(RELEASE_KEYSTORE base64 + 3 密码);agent / 普通 runner 不可读。
# 产物:APK / AAB / mapping.txt / SHA256SUMS → Gitea Release(由 scripts/gitea/publish-release.sh 上传)。
# 注:Gitea Actions secrets 是 repo 级而非 runner 级,独立 release runner 无额外安全增益,
# 直接用 android runner 即可。若未来要做 secrets 隔离,改用 Gitea Environments。
# 无外部 action(不依赖 github.com)。
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# 全局串行:runner 共用 gradle cache bind mount(/root/.gradle),并发 job 会锁冲突。
# group=ci-runner-serialization 让所有 workflow 在同 ref 上的 job 排队串行。
concurrency:
  group: ci-runner-serialization
  cancel-in-progress: false

jobs:
  release:
    runs-on: android
    # Gradle dist 已预装在 image /root/.gradle/wrapper/dists/(image 内只读,
    # 每容器从 layer 拿,无锁冲突)。Maven deps 每 job 重下(~2.5min)。
    steps:
      - name: Checkout(优先 LAN,空时回退公网;见 docs/specs/gitea-lan-bypass.md)
        env:
          TOKEN: ${{ github.token }}
          GITEA_LAN_URL: ${{ vars.MY_GITEA_LAN_URL }}
        run: |
          set -e
          GITEA_URL="${GITEA_LAN_URL:-https://git.vectory.cn:18443}"
          SCHEME="${GITEA_URL%%://*}"
          HOST="${GITEA_URL#*://}"
          printf '%s://x-access-token:%s@%s\n' "$SCHEME" "$TOKEN" "$HOST" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git config --global credential.helper store
          git config --global advice.detachedHead false
          git clone "$GITEA_URL/mfreceiver/oc-droid.git" .
          git fetch --tags --force
          git checkout -q "${{ github.sha }}"

      - name: 恢复临时 keystore(从 Secrets)
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE" | base64 -di > "$KS"
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'release.storeFile=%s\n' "$KS"
            printf 'release.storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'release.keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'release.keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > local.properties
          chmod 600 local.properties "$KS"

      - name: release-check(clean + lintRelease + testRelease + assembleRelease)
        run: ./scripts/ci/release-check.sh

      - name: 上传产物到 Gitea Release
        env:
          # Gitea Actions 自动注入 GITHUB_TOKEN(contents: write)。
          # 若 asset 上传 403,改用自建 secret RELEASE_GITEA_TOKEN(个人 token,release 权限)。
          # GITEA_URL 空 → publish-release.sh 内置默认(公网);站点 Variable 设置则走 LAN。
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_URL: ${{ vars.MY_GITEA_LAN_URL }}
          TAG: ${{ github.ref_name }}
        run: ./scripts/gitea/publish-release.sh "$TAG"

      - name: 更新 latest 标签（指向最新发版）
        # 每次 tag push 后,将 mutable `latest` tag force-move 到当前发版提交。
        # 用户/脚本可通过 `latest` tag 快速获取最新版,无需查 release 页面找版本号。
        env:
          TOKEN: ${{ github.token }}
          GITEA_LAN_URL: ${{ vars.MY_GITEA_LAN_URL }}
        run: |
          set -e
          GITEA_URL="${GITEA_LAN_URL:-https://git.vectory.cn:18443}"
          SCHEME="${GITEA_URL%%://*}"
          HOST="${GITEA_URL#*://}"
          printf '%s://x-access-token:%s@%s\n' "$SCHEME" "$TOKEN" "$HOST" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git config --global credential.helper store
          git tag -f latest "${{ github.sha }}"
          git push origin latest --force
          echo "✅ latest → ${{ github.ref_name }} (${{ github.sha }})"

      - name: 清理临时 keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" local.properties ~/.git-credentials

      - name: 通知企业微信（发版结果）
        # if: always() → 成功（附下载/Changelog 链接）与失败（附 Actions 链接）都通知。
        # WECOM_WEBHOOK 是站点级 Actions Variable（管理后台→管理设置→工作流→变量），全实例仓库继承，
        # 引用 vars.*（非 secrets.*）。best-effort：缺失或 qyapi 不可达只警告，不影响发版结果。
        if: always()
        env:
          WECOM_WEBHOOK: ${{ vars.WECOM_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          OUTCOME: ${{ job.status }}
        run: |
          BASE="https://git.vectory.cn:18443/mfreceiver/oc-droid"
          ./scripts/gitea/notify-wecom.sh "$WECOM_WEBHOOK" "$OUTCOME" "$TAG" \
            "$BASE/releases/tag/$TAG" "$BASE/actions"
